<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
{% include side.html %}
  <nav class="bar" aria-label="Sections">
    <a class="bar-home" href="{% unless page.url == "/" %}{{ '/' | relative_url }}{% endunless %}#top" aria-label="Top of page">{% include glyph.svg %}</a>
{% include menu.html %}
  </nav>
  <main id="main" class="main" tabindex="-1">
{{ content }}
  </main>
  <footer class="footer">
{% include footer.html %}
  </footer>
  <script src="{{ '/assets/js/nav.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/disc.js' | relative_url }}" defer></script>
</body>
</html>
